<body>
  <header class="barra">
    <div class="marca"><b>Torre 3D</b><span id="nombre-proyecto"></span></div>
    <div class="acciones">
      <div class="seg" role="group" aria-label="Dirección del viento">
        <button type="button" id="dir-A" aria-pressed="true">Viento A</button>
        <button type="button" id="dir-B" aria-pressed="false">Viento B</button>
      </div>
      <div class="seg" role="group" aria-label="Historia">
        <button type="button" id="b-deshacer" title="Deshacer (Ctrl+Z)" aria-label="Deshacer">↶</button>
        <button type="button" id="b-rehacer" title="Rehacer (Ctrl+Y)" aria-label="Rehacer">↷</button>
      </div>
      <button type="button" id="b-ejemplo">Ejemplo</button>
      <button type="button" id="b-nuevo">Nuevo</button>
      <label class="boton" for="b-abrir" title="Proyecto (.json), planilla del curso, tabla de niveles y muros o líneas de AutoCAD (.xlsx, .csv)">Abrir / importar…<input type="file" id="b-abrir" accept=".xlsx,.json,.csv,.tsv,.txt" hidden /></label>
      <button type="button" id="b-guardar">Guardar proyecto</button>
      <button type="button" id="b-exportar" class="primario">Escribir planilla .xlsx</button>
    </div>
  </header>
  <main class="app">
    <aside class="lateral">
      <nav class="pestanas" role="tablist" id="pestanas"></nav>
      <section class="panel" id="panel" role="tabpanel"></section>
    </aside>
    <section class="vistas">
      <div class="vista" id="vista-planta"><span class="rotulo">Planta de PB</span></div>
      <div class="vista" id="vista-3d"><span class="rotulo">3D</span></div>
    </section>
  </main>
  <dialog id="dialogo"></dialog>
