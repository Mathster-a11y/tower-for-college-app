<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Torre 3D</title>
  <!-- Torre 3D · © 2026 Augusto Andrés Marsella · Licencia de uso no comercial del 11/11/2026 al 11/11/2027 (ver LICENSE) -->
  <meta name="author" content="Augusto Andrés Marsella" />
  <meta name="copyright" content="© 2026 Augusto Andrés Marsella · Licencia de uso no comercial hasta el 11/11/2027" />
  <meta name="description" content="App web que acompaña la planilla «Edificios en torre» (FAUD-UNMDP): planta, 3D y cálculo en vivo, etapa por etapa." />
</head>
<body>
  <header class="barra" role="toolbar" aria-label="Herramientas">
    <span class="marca">TORRE</span>
    <span class="proyecto" id="nombre-proyecto"></span>
    <span class="sep"></span>
    <div class="grupo">
      <div class="menu-cont">
        <button type="button" id="b-ejemplos" aria-haspopup="true" aria-expanded="false">Ejemplos ▾</button>
        <div class="menu" id="m-ejemplos" role="menu">
          <button type="button" id="b-ejemplo" role="menuitem">Ejemplo de la guía 2024<span class="pista">Neuquén · 20 pisos · planta 20 × 16 m</span></button>
          <button type="button" id="b-ejemplo-asim" role="menuitem">Ejemplo de la guía con rototraslación<span class="pista">Anexo: T5 aislado de 4,00 × 0,20 m · la planta rota</span></button>
          <button type="button" id="b-nuevo" role="menuitem">Proyecto nuevo<span class="pista">Una azotea y PB; se arma desde Niveles</span></button>
        </div>
      </div>
      <div class="menu-cont">
        <button type="button" id="b-mis" aria-haspopup="true" aria-expanded="false" title="Versiones del proyecto guardadas en este navegador">Mis proyectos ▾</button>
        <div class="menu menu-mis" id="m-mis" role="menu"></div>
      </div>
      <label class="boton" for="b-abrir" title="Proyecto (.json), planilla del curso, tabla de niveles y muros o líneas de AutoCAD (.xlsx, .csv)">Abrir / importar…<input type="file" id="b-abrir" accept=".xlsx,.json,.csv,.tsv,.txt" hidden /></label>
    </div>
    <span class="sep"></span>
    <div class="grupo">
      <button type="button" class="glifo" id="b-deshacer" title="Deshacer (Ctrl+Z)" aria-label="Deshacer">↶</button>
      <button type="button" class="glifo" id="b-rehacer" title="Rehacer (Ctrl+Y)" aria-label="Rehacer">↷</button>
    </div>
    <span class="sep"></span>
    <div class="grupo">
      <div class="menu-cont">
        <button type="button" id="b-mostrar" aria-haspopup="true" aria-expanded="false">Mostrar ▾</button>
        <div class="menu" id="m-mostrar" role="menu">
          <button type="button" data-tema="" role="menuitem">Aspecto del sistema<span class="pista">Claro u oscuro, según la computadora</span></button>
          <button type="button" data-tema="light" role="menuitem">Clásico (claro)</button>
          <button type="button" data-tema="dark" role="menuitem">Tablero de dibujo (oscuro)</button>
          <hr />
          <button type="button" id="b-recorrido" role="menuitem">Recorrido guiado<span class="pista">Qué hay en cada parte de la pantalla</span></button>
        </div>
      </div>
      <div class="menu-cont">
        <button type="button" id="b-exportar-menu" aria-haspopup="true" aria-expanded="false">Exportar ▾</button>
        <div class="menu" id="m-exportar" role="menu">
          <button type="button" id="b-guardar" role="menuitem">Guardar proyecto (.json)<span class="pista">Para seguir en otra computadora</span></button>
          <button type="button" id="b-tabla" role="menuitem">Tabla de niveles y muros (.xlsx)<span class="pista">Sirve de plantilla para llenar en Excel</span></button>
          <button type="button" id="b-lamina" role="menuitem">Lámina de entrega A3<span class="pista">Una hoja apaisada por viento, con rótulo, para imprimir o guardar como PDF</span></button>
          <button type="button" id="b-desglose" role="menuitem">Desglose por hoja (PDF)<span class="pista">Cálculo analítico paso por paso al lado del Excel, hoja por hoja</span></button>
          <button type="button" id="b-desglose-pptx" role="menuitem">Desglose por hoja (PowerPoint)<span class="pista">Lo mismo en diapositivas (.pptx) para presentar</span></button>
          <button type="button" id="b-informe" role="menuitem">Informe para imprimir o PDF<span class="pista">Datos, cartas de los dos vientos, rototraslación y controles</span></button>
          <button type="button" id="b-sheets" role="menuitem">Sincronizar con Google Sheets…<span class="pista" id="b-sheets-pista">Editar el edificio desde la planilla o desde la app</span></button>
        </div>
      </div>
      <button type="button" class="primario" id="b-exportar">Escribir planilla .xlsx</button>
    </div>
    <span class="espacio"></span>
    <span class="chip-estado" id="estado-calculo">Calculado</span>
  </header>
  <main class="app">
    <nav class="riel" id="riel" aria-label="Etapas del cálculo"></nav>
    <aside class="lateral" id="lateral">
      <div class="banda" id="banda"><span class="chip" id="banda-nro">01</span><h2 id="banda-titulo"></h2></div>
      <div class="subpasos" id="subpasos" role="group"></div>
      <section class="panel" id="panel"></section>
    </aside>
    <section class="centro" aria-label="Dibujo">
      <div class="tira" id="tira-centro"></div>
      <div class="lienzo" id="lienzo">
        <div class="centro-planta" id="vista-planta"></div>
        <div class="centro-dibujos" id="centro-dibujos" hidden></div>
      </div>
    </section>
    <aside class="derecha" aria-label="Axonometría y avance">
      <div class="bloque3d">
        <div class="tira"><span class="nombre">Axonometría</span><span class="espacio"></span><button type="button" class="mini" id="b-encuadrar" title="Doble clic en el dibujo hace lo mismo">Encuadrar</button></div>
        <div class="vista3d" id="vista-3d"></div>
        <div class="capas" id="capas"></div>
      </div>
      <div class="avance" id="avance"></div>
    </aside>
  </main>
  <footer class="estado-linea"><span id="mensaje">Listo.</span><span class="espacio"></span><span class="coords" id="coords"></span><a class="autoria" id="autoria" href="https://github.com/Mathster-a11y/tower-for-college-app/blob/main/LICENSE" target="_blank" rel="noopener license" title="Torre 3D es obra de Augusto Andrés Marsella. Del 11/11/2026 al 11/11/2027 se puede usar, compartir y adaptar citando al autor y sin fines comerciales.">© 2026 Augusto Andrés Marsella · Licencia de uso no comercial hasta el 11/11/2027</a></footer>
  <dialog id="dialogo"></dialog>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
