# Pruebas y builds en cada pull request y en cada push a main; publica en GitHub Pages solo desde main.
# GitHub Pages en un repositorio privado necesita un plan pago; en uno público es gratis.
# Para activarlo: Settings → Pages → Source: «GitHub Actions».
#
# Seguridad (informe técnico, hallazgo 8):
#  - un pull request valida todo (tipos, pruebas, las dos variantes) sin ningún permiso de publicación;
#  - solo el job «deploy» tiene pages: write e id-token: write, y corre únicamente después del build de main;
#  - las acciones van fijadas a un commit (el comentario dice la versión) para que nadie pueda cambiar lo que corre.
name: Probar y publicar
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: probar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # web (dist/) y archivo único: el mismo HTML que se descarga queda dentro del sitio, en torre3d.html
      - run: npm run build
      - run: npm run build:unico && cp dist-unico/index.html dist/torre3d.html
      - name: Tamaño del archivo único
        run: ls -l dist/torre3d.html
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # una publicación a la vez y sin cortar la que está en curso
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
